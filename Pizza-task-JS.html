<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Document</title>
</head>

<body>

    <style>
        .container {
            padding: 20px;
        }

        .opt {
            width: 100%;
            height: 5vh;
        }

        .btn {
            background-color: transparent;
            width: 100px;
            height: 30px;
            border: 1px solid black;
            border-radius: 3px;
        }

        .btn-one {
            background-color: #ff8c00;
            color: white;
            border: 0;
        }

        .display {
            display: flex;
        }

        .cheese {
            margin-right: 50px;
        }

        .receipt {
            border-bottom: 2px dashed black;
            padding-bottom: 10px;
        }

        .final {
            border-top: 2px dashed black;
            padding-bottom: 10px;
        }

        .place {
            background-color: green;
            border: 0;
            width: 170px;
            height: 40px;
            border-radius: 5px;
            color: white;
            margin-left: 120px;
            margin-top: 20px;
        }

        .main-container {
            height: 100vh;
            background-color: #fdedd7;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .card {
            background-color: white;
            padding: 15px;
            border-radius: 9px;
            box-shadow: 2px 2px 10px black;
        }

        .base {
            display: flex;
            justify-content: space-between;
        }
    </style>

    <div class="main-container">

        <div style="margin-bottom: 100px;" class="container">
            <h1> <i class="fa-solid fa-pizza-slice" style="color:#ff8c00;"></i> BUILT YOUR SMART PIZZA </h1>
            <h5>CRUST</h5>
            <select id="sizes" class="opt">
                <option>Thin($8.00)</option>
                <option>Regular($10.00)</option>
                <option>Stuffed($12.00)</option>
            </select>
            <br />
            <br />
            <br />
            <br />
            <h5>SIZE</h5>
            <button class="btn">Small</button>
            <button class="btn">Medium</button>
            <button class="btn-one btn">Large</button>

            <h3> TOPPINGS </h3>

            <div class="display">
                <div>
                    <input id="cheese" type="checkbox" />
                    <label for="cheese" class="cheese">Cheese </label>
                    <br />
                    <input id="Mushrooms" type="checkbox" />
                    <label for="Mushrooms"> Mushrooms </label>
                    <br />
                    <input id="Peppers" type="checkbox" />
                    <label for="Peppers"> Peppers </label>
                </div>

                <div>
                    <input id="mushrooms" type="checkbox" />
                    <label for="mushrooms">Mushrooms </label>
                    <br />
                    <input id="Pepperoni" type="checkbox" />
                    <label for="Pepperoni"> Pepperoni </label>
                    <br />
                    <input id="Chicken" type="checkbox" />
                    <label for="Chicken"> Chicken </label>
                </div>
            </div>
        </div>

        <div class="container">
            <h1> <i class="fa-solid fa-receipt" style="color: lightgray;"></i> YOUR RECEIPT </h1>
            <div class="card">
                <h4 class="receipt"> LARGE STUFFED CRUST PIZZA </h4>

                <div class="base">
                    <p>Base :</p>
                    <p id="Base">$0.00</p>
                </div>

                <div class="base">
                    <p>Toppings :</p>
                    <p id="Toppings">$0.00</p>
                </div>
                <div class="base">
                    <p>SubTotal:</p>
                    <p id="SubTotal">$0.00</p>
                </div>

                <div class="base">
                    <p>Discount:</p>
                    <p>10%(SAVE10)</p>
                </div>

                <div class="base">
                    <h1 class="final"> Final Total</h1>
                    <h1 id="final" class="final">$0.00</h1>
                </div>

            </div>
            <button onclick="order()" class="place"> Place Order </button>
        </div>
    </div>


    <script>
        let Base = document.getElementById("Base");
        let Toppings = document.getElementById("Toppings");
        let SubTotal = document.getElementById("SubTotal");
        let base;
        let final = document.getElementById("final");

        function order() {
            let satya = document.getElementById("sizes").value;
            if (satya === "Thin($8.00)") {
                base = 8;
                Base.textContent = "$8.00";
            }
            else if (satya === "Regular($10.00)") {
                base = 10;
                Base.textContent = "$10.00";
            }
            else {
                base = 12;
                Base.textContent = "$12.00";
            }

            let count = 0;
            let top = document.getElementById("cheese").checked;
            let Mushrooms = document.getElementById("Mushrooms").checked;
            let Peppers = document.getElementById("Peppers").checked;
            let Chicken = document.getElementById("Chicken").checked;
            if (top) {
                count++;
            }
            if (Mushrooms) {
                count++;
            }
            if (Peppers) {
                count++;
            }
            if (Chicken) {
                count++;
            }
            Toppings.textContent = "$" + count + ".00";

            let total = count + base;
            SubTotal.textContent = "$" + total + ".00";

            let finalCost = total/100 * 10;
            let min = total - finalCost
            final.textContent = "$"+ min;

        }





    </script>


</body>

</html>

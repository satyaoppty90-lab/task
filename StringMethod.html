<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 1. Length Property
        // Returns the number of characters.
        let str = "JavaScript";
        let strOne = "Hello World"
        console.log(str.length);
        console.log(strOne.length);

        // 2. toUpperCase()
        // Converts all letters to uppercase.
        let Upper = "hello";
        let UpperOne = "Javascript"
        console.log(Upper.toUpperCase());
        console.log(UpperOne.toUpperCase());

        // 3. toLowerCase()
        // Converts all letters to lowercase.
        let Lower = "HELLO";
        let LowerOne = "WORLD";
        console.log(Lower.toLowerCase());
        console.log(LowerOne.toLowerCase());

        // 4. trim()
        // Removes spaces from both ends.
        console.log("  Hello  ".trim());
        console.log("    satya    ".trim())

        // 5. trimStart()
        // Removes spaces from the beginning.
        console.log("  Hello".trimStart());
        console.log("      satya".trimStart());

        // 6. trimEnd()
        // Removes spaces from the end.
        console.log("Hello  ".trimEnd());
        console.log("satya   ".trimEnd());

        // 7. charAt()
        // Returns the character at a specified index.
        console.log("Hello".charAt(1));
        console.log("satya".charAt(3));

        // 8. at()
        // Returns character at an index (supports negative indexes).
        console.log("Hello".at(-1));
        console.log("javascript".at(-3));

        // 9. indexOf()
        // Returns the first occurrence index.
        console.log("Hello".indexOf("l"));
        console.log("satya".indexOf("t"));

        // 10. lastIndexOf()
        // Returns the last occurrence index.
        console.log("Hello".lastIndexOf("l"));

        // 11. includes()
        // Checks if a string contains a value.
        console.log("Hello".includes("ell"));
        console.log("satya".includes("sa"));

        // 12. startsWith()
        // Checks if string starts with specified text.
        console.log("Hello".startsWith("He"));
        console.log("satya".startsWith("sa"));

        // 13. endsWith()
        // Checks if string ends with specified text.
        console.log("Hello".endsWith("lo"));
        console.log("satya".endsWith("ya"));

        // 14. slice()
        // Extracts part of a string.
        console.log("Hello".slice(1, 4));
        console.log("satya".slice(1,3));

        // 15. substring()
        // Extracts characters between indexes.
        console.log("Hello".substring(1, 4));
        console.log("satya".substring(2,4));

        // 16. substr() (Deprecated)
        console.log("Hello".substr(1, 3));
        console.log("satya".substr(1,4));

        // 17. replace()
        // Replaces first matching value.
        console.log("Hello World".replace("World", "JS"));
        console.log("java".replace("java","Python"));

        // 18. replaceAll()
        // Replaces all matching values.
        console.log("cat cat cat".replaceAll("cat", "dog"));
        console.log("tiger tiger tiger".replaceAll("tiger","lion"))

        // 19. concat()
        // Joins strings.
        console.log("Hello".concat(" ", "World"));
        console.log("hello".concat("satya"));

        // 20. split()
        // Converts string into an array.
        console.log("a,b,c".split(","));
        console.log("1-2-3-4".split("-"));

        // 21. repeat()
        // Repeats a string.
        console.log("Hi ".repeat(3));
        console.log("hello".repeat(4));

        // 22. padStart()
        // Adds characters at the beginning.
        console.log("5".padStart(3, "0"));
        console.log("world".padStart(1, "Hello"));

        // 23. padEnd()
        // Adds characters at the end.
        console.log("5".padEnd(3, "0"));
        console.log("hello".padEnd(1, "world"));




    </script>
</body>

</html>

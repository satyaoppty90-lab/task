<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="card">
            <h2>🌦 Weather Application</h2>
            <label>Enter City Name</label>
            <input id="weather" type="search" placeholder="Enter city name">
            <button id="btn">Search Weather</button>
            <div id="cardOne" class="result">
                <p>🌡 Temperature :
                    <span id="time"></span> °C
                </p>
                <p>💧 Humidity :
                    <span id="weatherPara"></span> %
                </p>
                <p>💨 Wind Speed :
                    <span id="Wind"></span> m/s
                </p>
            </div>
        </div>

        <div class="card">
            <h2>📍 Google Maps</h2>
            <label>Enter City Name</label>
            <input id="searchMap" type="search" placeholder="Search location">
            <button id="btnOne">Search Location</button>
            <iframe id="map"></iframe>
        </div>
    </div>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            padding: 30px;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1300px;
        }

        .card {
            background: linear-gradient(105deg, #05e1ec, #9ecef8);
            width: 500px;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .2);
        }

        .card h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            height: 45px;
            margin-top: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            padding-left: 15px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border: 2px solid #2196f3;
        }

        button {
            width: 100%;
            height: 45px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: .3s;
        }

        button:hover {
            background: #0d8bf2;
        }

        .result {
            margin-top: 25px;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }

        .result p {
            font-size: 18px;
            margin: 15px 0;
            color: #333;
        }

        span {
            color: #2196f3;
            font-weight: bold;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 12px;
            margin-top: 20px;
        }

        @media(max-width:1100px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 95%;
            }
        }
    </style>

    <script>
        let time = document.getElementById("time");
        let weatherPara = document.getElementById("weatherPara");
        let wind = document.getElementById("Wind");
        let button = document.getElementById("btn");
        let cardOne = document.getElementById("cardOne");


        function weather() {
            let city = document.getElementById("weather").value;
            let apiKey = "c6bb504f44dd412102a8b96ad2089b85";

            let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;
            let options = {
                method: "GET"
            }

            fetch(url, options)
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    if (data.main.temp > 25) {
                        cardOne.style.backgroundColor = "red"
                    } else if (data.main.temp < 25) {
                        cardOne.style.backgroundColor = "orange"
                    }
                    time.textContent = data.main.temp;
                    weatherPara.textContent = data.main.humidity;
                    wind.textContent = data.wind.speed;
                }).catch(function (error) {
                    alert("invalid City");
                });
        }
        button.addEventListener("click", weather);

        let btnOne = document.getElementById("btnOne");
        let map = document.getElementById("map");

        function showCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        let lat = position.coords.latitude;
                        let lon = position.coords.longitude;
                        map.src = `https://www.google.com/maps?q=${lat},${lon}&output=embed`;
                    },
                    function (error) {
                        alert("Unable to get your location.");
                    }
                );
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }
        showCurrentLocation();


        function searchMap() {
            let city = document.getElementById("searchMap").value;
            document.getElementById("map").src =
                `https://www.google.com/maps?q=${city}&output=embed`;

        }
        btnOne.addEventListener("click", searchMap);

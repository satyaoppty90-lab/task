<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
</head>

<body>
    <div id="Cartcontainer">
    </div>


    <style>
        .demo {
            background-color: orange;
            border-width: 0px;
            width: 100px;
            height: 30px;
            color: black;
            border-radius: 10px;
            margin-left: 20px;
        }

        .demo1 {
            color: blue;
            text-decoration: underline;
        }
    </style>



    <script>

        let headElement = document.createElement("h1");
        headElement.textContent = "Welcome to Javascript Classes";
        let container = document.getElementById("Cartcontainer");
        container.appendChild(headElement);
        console.log(container);
        let button = document.createElement("button");
        button.textContent = "Click Me";

        let buttonTwo = document.createElement("button");
        buttonTwo.textContent = "Remove style";
        container.appendChild(buttonTwo);

        button.onclick = function () {
            headElement.textContent = "This is DOM Manupulation Session";
            headElement.classList.add("demo1");
            button.textContent = "JS Class";
            button.classList.add("demo");
            buttonTwo.classList.add("demo");
            para.textContent = "We are happy train you..."
        }



        buttonTwo.onclick = function () {
            headElement.classList.remove("demo1");
            button.classList.remove("demo");
            buttonTwo.classList.remove("demo");

        }

        //JavaScript Arithmetic Operators

        console.log("multiplication :" + e);
        // Exponentiation
        let f = a ** b;
        console.log("Exponentiation :" + f);
        //Division
        let g = a / b;
        console.log("Division :" + g);
        //Modulus 
        let h = a % b;
        console.log("Modulus :" + h);
        //Increment
        let i = a++;
        console.log("Increment :" + i);
        //Decrement
        let j = a--;
        console.log("Decrement :" + j);




        // Arrays 
        let arr = [90, "two", 9.8, false];
        console.log(arr);

        arr[1] = 2;
        console.log(arr);

        let arr1 = arr.push("satya");
        arr.push("vinay")

        // removing value from array
        let pop = arr.pop();
        console.log(arr);


        // Indexing 
        let arr2 = ["banana", 124, true]
        console.log(typeof (arr2[0]))
        console.log(typeof (arr2[1]))
        console.log(typeof (arr2[2]))
        console.log(arr2);

        // Loops
        for (let i of arr2) {
            console.log(i)
        }

        let hero = {

            designation: "software"
        }
        console.log("My Name is " + hero.name + " " + "My Age is " + hero.age + "  " + "and My designation is " + hero.designation);



        // 1. Sum of the values of an array
        let array = [12, 1, 2, 4, 1];
        let adding = 0;
        for (let values of array) {
            adding += values
        }
        console.log("Sum Of Array  " + adding);

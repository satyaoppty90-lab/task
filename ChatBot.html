<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <h2>🤖 AI Chatbot</h2>

        <div id="chatBox">

        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message..." />

            <button onclick="sendMessage()">Send</button>
        </div>

    </div>




    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 420px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, .3);
        }

        h2 {
            background: #4a6cf7;
            color: white;
            text-align: center;
            padding: 15px;
        }

        #chatBox {
            height: 450px;
            overflow-y: auto;
            padding: 15px;
            background: #f4f4f4;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
            width: fit-content;
            max-width: 80%;
        }

        .user {
            background: #4a6cf7;
            color: white;
            margin-left: auto;
        }

        .bot {
            background: #ddd;
        }

        .input-area {
            display: flex;
        }

        input {
            flex: 1;
            padding: 15px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        button {
            padding: 15px 25px;
            border: none;
            background: #4a6cf7;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3154e6;
        }
    </style>




    <script>
        const API_KEY = "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";

        const chatBox = document.getElementById("chatBox");
        const input = document.getElementById("userInput");

        function addMessage(text, className) {
            let div = document.createElement("div");
            div.className = "message " + className;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            let message = input.value;
            if (message === "") return;
            addMessage(message, "user");
            input.value = "";
            addMessage("Fetching data...", "bot");
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + API_KEY,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-20b:free",
                        messages: [
                            {
                                role: "user",
                                content: message
                            }
                        ]
                    })
                });

                const data = await response.json();
               
                if (!response.ok) {
                    chatBox.removeChild(chatBox.lastChild);
                    addMessage(data.error?.message || "API Error", "bot");
                    return;
                }
                chatBox.removeChild(chatBox.lastChild);
                addMessage(data.choices[0].message.content, "bot");
            }
            catch (error) {
                chatBox.removeChild(chatBox.lastChild);
                addMessage("Something went wrong!", "bot");
                console.log(error);
            }
        }

        input.addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        });
    </script>

</body>

</html>
